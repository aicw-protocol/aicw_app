name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          SKIP_ISSUER_REGION_INDEX: "1"
          NEXT_STATIC_BASE_PATH: /aicw_app
          NEXT_PUBLIC_BASE_PATH: /aicw_app
          NEXT_PUBLIC_AICW_PUBLIC_ORIGIN: https://aicw-protocol.github.io/aicw_app
          NEXT_PUBLIC_SOLANA_CLUSTER: devnet
          NEXT_PUBLIC_SOLANA_RPC: https://devnet.helius-rpc.com/?api-key=184025eb-79d2-4515-bb83-01d895249a4d
          NEXT_PUBLIC_AICW_PROGRAM_ID: FcWqrRLcAxwqAhMSGXabD8zEKqnPHsovBvcmLaH9hsVv
          NEXT_PUBLIC_MPC_BRIDGE_URL: https://bridge.aicw.ai
          NEXT_PUBLIC_AICW_SKILL_MD_URL: https://aicw-protocol.github.io/aicw_app/aicw_skill.md
          NEXT_PUBLIC_AICW_DROP_URL: ${{ secrets.AICW_DROP_PUBLIC_URL }}
          NEXT_PUBLIC_NODE_WEB_API_URL: ${{ secrets.NODE_WEB_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
